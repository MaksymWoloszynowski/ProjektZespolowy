name: Frontend CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
        paths:
        - "frontend/**"
        - ".github/workflows/frontend-ci.yml"

jobs:
    frontend-changes:
        runs-on: ubuntu-latest
        outputs:
            frontend: ${{ steps.filter.outputs.frontend }}
        steps:
          - uses: actions/checkout@v7

          - id: filter
            uses: dorny/paths-filter@v3
            with:
                filters: |
                    frontend:
                    - "frontend/**"

    frontend-build:
        needs: frontend-changes
        if: needs.frontend-changes.outputs.frontend == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend

        steps:
          - name: Checkout
            uses: actions/checkout@v7

          - name: Setup Node
            uses: actions/setup-node@v7
            with:
                node-version: 24
                cache: npm
                cache-dependency-path: frontend/package-lock.json

          - name: Install dependencies
            run: npm ci
        
          - name: Run lint
            run: npm run lint

          - name: Build project
            run: npm run build